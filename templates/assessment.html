<!DOCTYPE html>
<html>
<head>
    <title>Python Assessment</title>
</head>

<body>

    <h1>Python Skill Assessment</h1>

    <p>Answer all the questions below.</p>

    <form method="post">
        {% csrf_token %}

        {% for question in questions %}

            <div>
                <h3>{{ forloop.counter }}. {{ question.question_text }}</h3>

                <label>
                    <input type="radio" name="question_{{ question.id }}" value="A" required>
                    A. {{ question.option_a }}
                </label>
                <br>

                <label>
                    <input type="radio" name="question_{{ question.id }}" value="B">
                    B. {{ question.option_b }}
                </label>
                <br>

                <label>
                    <input type="radio" name="question_{{ question.id }}" value="C">
                    C. {{ question.option_c }}
                </label>
                <br>

                <label>
                    <input type="radio" name="question_{{ question.id }}" value="D">
                    D. {{ question.option_d }}
                </label>

                <br><br>
            </div>

        {% endfor %}

        <button type="submit">Submit Assessment</button>

    </form>

</body>
</html>
