<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leave a Review - Skill Exchange</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f4ed;
            color: #26382f;
        }

        /* Navigation */

        .navbar {
            width: 100%;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fffdf8;
            border-bottom: 1px solid #e5e0d5;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #496b58;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #4d5d54;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #496b58;
        }

        .logout-btn {
            padding: 10px 18px;
            border-radius: 25px;
            background: #496b58;
            color: white !important;
        }

        /* Main */

        .container {
            width: 90%;
            max-width: 650px;
            margin: 65px auto 80px;
        }

        .review-card {
            background: #fffdf8;
            padding: 45px;
            border-radius: 30px;
            box-shadow: 0 15px 40px rgba(45, 61, 51, 0.08);
        }

        /* Header */

        .review-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .review-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: #e5eee2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
        }

        .review-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .review-header p {
            color: #748078;
            line-height: 1.6;
            font-size: 14px;
        }

        .username {
            color: #496b58;
            font-weight: bold;
        }

        /* Form */

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #4d5d54;
        }

        .rating-select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d9dfd8;
            border-radius: 14px;
            background: #faf9f4;
            color: #26382f;
            font-size: 14px;
            outline: none;
        }

        .rating-select:focus {
            border-color: #496b58;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #d9dfd8;
            border-radius: 16px;
            background: #faf9f4;
            color: #26382f;
            font-family: Arial, sans-serif;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #496b58;
        }

        textarea::placeholder {
            color: #a0a7a2;
        }

        /* Button */

        .submit-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 30px;
            background: #496b58;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #748078;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover {
            color: #496b58;
        }

        /* Mobile */

        @media (max-width: 850px) {

            .nav-links {
                display: none;
            }

            .container {
                width: 92%;
                margin-top: 40px;
            }

            .review-card {
                padding: 30px 22px;
            }

            .review-header h1 {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>


    <!-- Navigation -->

    <nav class="navbar">

        <a href="{% url 'dashboard' %}" class="logo">
            Skill Exchange
        </a>

        <div class="nav-links">

            <a href="{% url 'dashboard' %}">
                Home
            </a>

            <a href="{% url 'find_people' %}">
                Find People
            </a>

            <a href="{% url 'profile' %}">
                My Profile
            </a>

            <a href="{% url 'exchange_requests' %}">
                Requests
            </a>

            <a href="{% url 'logout' %}" class="logout-btn">
                Logout
            </a>

        </div>

    </nav>


    <main class="container">

        <div class="review-card">


            <!-- Header -->

            <div class="review-header">

                <div class="review-icon">
                    ⭐
                </div>

                <h1>
                    Share Your Experience
                </h1>

                <p>
                    How was your skill exchange with
                    <span class="username">
                        {{ reviewed_user.username }}
                    </span>?
                </p>

            </div>


            <!-- Review form -->

            <form method="post">

                {% csrf_token %}


                <div class="form-group">

                    <label for="rating">
                        Your Rating
                    </label>

                    <select
                        id="rating"
                        name="rating"
                        class="rating-select"
                        required
                    >

                        <option value="">
                            Select your rating
                        </option>

                        <option value="1">
                            1 ⭐
                        </option>

                        <option value="2">
                            2 ⭐⭐
                        </option>

                        <option value="3">
                            3 ⭐⭐⭐
                        </option>

                        <option value="4">
                            4 ⭐⭐⭐⭐
                        </option>

                        <option value="5">
                            5 ⭐⭐⭐⭐⭐
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="comment">
                        Your Experience
                    </label>

                    <textarea
                        id="comment"
                        name="comment"
                        rows="6"
                        placeholder="Share your experience with this skill exchange..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-btn"
                >
                    Submit Review
                </button>


            </form>


            <a
                href="{% url 'user_profile' reviewed_user.id %}"
                class="back-link"
            >
                Back to Profile
            </a>


        </div>

    </main>

</body>

</html>
